{{- /* Stoico <Frame>, for the rare image in a note: radius 0, a mono index ("Fig. 01")
       and the Markdown title as caption. */ -}}
{{- $alt := .PlainText | default .Text -}}
<figure class="st-frame ed-figure">
  <div class="st-frame__media"><img src="{{ .Destination | safeURL }}" alt="{{ $alt }}" loading="lazy" decoding="async"></div>
  {{- with .Title }}
  <figcaption class="st-frame__caption"><span class="st-frame__index">Fig. {{ printf "%02d" (add $.Ordinal 1) }}</span><span>{{ . }}</span></figcaption>
  {{- end }}
</figure>
