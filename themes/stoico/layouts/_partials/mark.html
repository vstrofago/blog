{{- /* The vstrofago 9×9 pixel star, same paths and classes as Stoico's <Mark>, so
       motion "spin" / "build" animate through motion.css. */ -}}
{{- $size := .size | default 18 -}}
<span class="animation-mark{{ with .motion }} animation-mark--{{ . }}{{ end }}" aria-hidden="true">
  <svg class="mark__svg" viewBox="0 0 9 9" width="{{ $size }}" height="{{ $size }}" aria-hidden="true" focusable="false" shape-rendering="crispEdges"><path class="mark__core" d="M3 3h3v3H3z"/><path class="mark__a1" d="M4 2h1v1H4zM6 4h1v1H6zM4 6h1v1H4zM2 4h1v1H2z"/><path class="mark__a2" d="M4 1h1v1H4zM7 4h1v1H7zM4 7h1v1H4zM1 4h1v1H1z"/><path class="mark__a3" d="M4 0h1v1H4zM8 4h1v1H8zM4 8h1v1H4zM0 4h1v1H0z"/><path class="mark__diagonal mark__diagonal--tl" d="M2 2h1v1H2z"/><path class="mark__diagonal mark__diagonal--tr" d="M6 2h1v1H6z"/><path class="mark__diagonal mark__diagonal--br" d="M6 6h1v1H6z"/><path class="mark__diagonal mark__diagonal--bl" d="M2 6h1v1H2z"/></svg>
</span>
