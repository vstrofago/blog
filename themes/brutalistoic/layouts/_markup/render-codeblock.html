{{- /* Placa de código = Terminal del DS (marco + CRT) con el resaltado de Chroma
       dentro, mapeado a tokens en chroma.css. El único estilo de código del DS. */ -}}
{{- $highlight := transform.HighlightCodeBlock . -}}
{{- $lang := .Type | default "text" -}}
<section class="bl-terminal bl-crt" data-theme="terminal" aria-label="{{ $lang }}">
  <div class="bl-terminal__bar">
    <span>{{ $lang }}</span>
    <button type="button" class="bl-terminal__copy" data-bl-copy data-bl-copied="{{ i18n "copied" }}">{{ i18n "copyCode" }}</button>
  </div>
  <div class="bl-terminal__screen bl-terminal__code">
    {{- $highlight.Wrapped }}
  </div>
</section>
