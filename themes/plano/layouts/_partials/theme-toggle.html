{{- /* Toggle de tema: claro (canónico) ↔ oscuro (opt-in). El estado lo resuelve el JS;
       el botón solo declara intención y se mantiene accesible con teclado. */ -}}
<button class="vf-toggle" type="button" data-vf-theme-toggle aria-pressed="false"
  aria-label="{{ i18n "themeToggle" }}" title="{{ i18n "themeToggle" }}">
  <span class="vf-toggle__moon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </span>
  <span class="vf-toggle__sun" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg>
  </span>
</button>
