baseURL = 'https://vstrofago.github.io/blog/'
title = 'VSTROFAGO'
theme = 'brutalistoic'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableEmoji = true
locale = 'en-US'

[pagination]
  pagerSize = 10

[languages]
  [languages.en]
    label = 'English'
    locale = 'en-US'
    contentDir = 'content/en'
    title = 'VSTROFAGO'
    weight = 1
    [languages.en.params]
      description = 'Notes, projects and experiments.'
      DateFormat = 'January 2, 2006'
      [languages.en.params.mainSite]
        name = 'Home'
        url = 'https://vstrofago.github.io/'
      [languages.en.params.homeInfoParams]
        Title = "Hi, welcome to VSTROFAGO's blog"
        Content = 'Things that pass through my mind: I write when something keeps going round in my head.'
    [[languages.en.menu.main]]
      name = 'Posts'
      url = 'posts/'
      weight = 10
    [[languages.en.menu.main]]
      name = 'About'
      url = 'about/'
      weight = 20

  [languages.es]
    label = 'Español'
    locale = 'es-ES'
    contentDir = 'content/es'
    title = 'VSTROFAGO'
    weight = 2
    [languages.es.params]
      description = 'Notas, proyectos y experimentos.'
      DateFormat = '2006-01-02'
      [languages.es.params.mainSite]
        name = 'Inicio'
        url = 'https://vstrofago.github.io/es/'
      [languages.es.params.homeInfoParams]
        Title = 'Hola, bienvenido al blog de VSTROFAGO'
        Content = 'Cosas que pasan por mi mente: escribo cuando algo me da vueltas.'
    [[languages.es.menu.main]]
      name = 'Entradas'
      url = 'posts/'
      weight = 10
    [[languages.es.menu.main]]
      name = 'Acerca'
      url = 'about/'
      weight = 20

[params]
  author = 'VSTROFAGO'
  # Pestaña del navegador: «Blog» y «<entrada> · Blog»
  tabTitle = 'Blog'
  # Contenido
  mainSections = ['posts']
  homeLimit = 5
  ShowReadingTime = true
  ShowWordCount = true
  ShowLastMod = false
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false

[[params.socialIcons]]
  name = 'GitHub'
  url = 'https://github.com/vstrofago'
[[params.socialIcons]]
  name = 'RSS'
  url = 'index.xml'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = false
    anchorLineNos = false
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[taxonomies]
  tag = 'tags'
  category = 'categories'

[outputs]
  home = ['HTML', 'RSS', 'JSON']
