baseURL = 'https://vstrofago.github.io/blog/'
title = 'vstrofago'
theme = 'stoico'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
# Topics keep the case they are written in (Stoico: sentence case, never Title Case).
capitalizeListTitles = false
enableEmoji = false
locale = 'en-US'

[pagination]
  pagerSize = 10

[languages]
  [languages.en]
    label = 'English'
    locale = 'en-US'
    contentDir = 'content/en'
    title = 'vstrofago'
    weight = 1
    [languages.en.params]
      description = 'Essays and field notes by vstrofago: on software, attention and whatever keeps going round in my head.'
      tabTitle = 'Notes · vstrofago'
      DateFormat = 'January 2, 2006'
      [languages.en.params.mainSite]
        name = 'Portfolio'
        url = 'https://vstrofago.github.io/'
      [languages.en.params.homeInfoParams]
        Title = 'Writing, slowly.'
        Content = 'On software, attention and whatever keeps going round in my head. When there is something to say.'
    [[languages.en.menu.main]]
      name = 'Archive'
      url = 'posts/'
      weight = 10
    [[languages.en.menu.main]]
      name = 'About'
      url = 'about/'
      weight = 20

  [languages.es]
    label = 'Español'
    locale = 'es-ES'
    contentDir = 'content/es'
    title = 'vstrofago'
    weight = 2
    [languages.es.params]
      description = 'Ensayos y notas de campo de vstrofago: sobre software, atención y lo que me sigue dando vueltas en la cabeza.'
      tabTitle = 'Notas · vstrofago'
      DateFormat = '2006-01-02'
      [languages.es.params.mainSite]
        name = 'Portafolio'
        url = 'https://vstrofago.github.io/es/'
      [languages.es.params.homeInfoParams]
        Title = 'Escribir, despacio.'
        Content = 'Sobre software, atención y lo que me sigue dando vueltas en la cabeza. Cuando hay algo que decir.'
    [[languages.es.menu.main]]
      name = 'Archivo'
      url = 'posts/'
      weight = 10
    [[languages.es.menu.main]]
      name = 'Acerca'
      url = 'about/'
      weight = 20

[params]
  author = 'vstrofago'
  # Contenido
  mainSections = ['posts']
  homeLimit = 5
  ShowReadingTime = true
  ShowWordCount = true
  ShowLastMod = false
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false

[[params.socialIcons]]
  name = 'GitHub'
  url = 'https://github.com/vstrofago'
[[params.socialIcons]]
  name = 'X'
  url = 'https://x.com/vstrofago'
[[params.socialIcons]]
  name = 'YouTube'
  url = 'https://www.youtube.com/@vstrofago'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = false
    anchorLineNos = false
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[taxonomies]
  tag = 'tags'
  category = 'categories'

[outputs]
  home = ['HTML', 'RSS', 'JSON']
