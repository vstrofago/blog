version: 2
updates:
  # Workflow actions are pinned to commit SHAs; this is what keeps those pins fresh.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # The PaperMod theme is a submodule pinned to a commit; watch it for updates.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
